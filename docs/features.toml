# Verification grades of KoflCraft features (AG-17).
#
# `cargo xtask status` writes docs/status.md from this file; a test and the
# CI `checks` job fail when the page is out of date or a listed test does
# not exist.
#
# Grades:
#   verified   — checked against an exact or independent reference by a named test
#   partial    — works on the named fixtures, known gaps
#   unverified — built, not yet checked
#   open       — not built
#
# `tests` name test functions as "path/to/file.rs::function". A verified or
# partial feature lists at least one. `commands` are further checks that run
# in CI (for example the acceptance runner).

[[feature]]
id = "m1-box"
title = "M1 box clipped Voronoi, validation, VTU and Gmsh export, CLI and MCP"
requirements = ["M1-01", "M1-11"]
grade = "verified"
how = "16/64/256-site lattice and clustered fixtures read back by independent VTU and MSH 4.1 readers and by Gmsh; CLI and MCP builds give equal topology digests and identical files; analytic two-cell metrics"
tests = [
  "tests/box_voronoi.rs::deterministic_lattices_and_nonuniform_sites_partition_the_cube",
  "tests/box_voronoi.rs::box_clipping_handles_crossings_coplanar_edges_and_tangency",
  "tests/export_roundtrip.rs::two_cell_box_has_analytic_metrics",
  "tests/export_roundtrip.rs::vtu_contains_complete_outward_polyhedron_faces",
  "crates/mesh-cli/tests/workflow.rs::generate_check_report_and_export_round_trip",
  "crates/mesh-mcp/tests/stdio.rs::stdio_tools_run_the_shared_engine_and_bound_writes",
]
commands = ["cargo m1 --require-gmsh"]
gaps = "—"

[[feature]]
id = "alg-04"
title = "Nearest-site Voronoi clipping with a security-radius completeness test (ALG-04, ALG-13)"
requirements = ["ALG-04", "ALG-13"]
grade = "verified"
how = "On lattices (cospherical sites), clustered sites and 2,000 graded sites, every cell has the same bisector neighbours, boundary faces, face areas and volume as the exhaustive all-pairs reference, which stays in the code; the k-d tree equals a brute-force sort; shortening the security radius makes the comparison fail; benchmark to 64,000 sites in research/alg-04-neighbour-clipping.md (26-28x faster at 16,000 sites, same cells in every case run both ways)"
tests = [
  "crates/mesh-algorithms/src/neighbours.rs::nearest_equals_brute_force",
  "tests/box_voronoi.rs::nearest_site_clipping_equals_the_all_pairs_reference",
]
commands = ["cargo run --release -p mesh-engine --example clipping_benchmark"]
gaps = "Serial; the CPU cost per cell grows with the number of neighbours within twice its radius, so cells next to large empty regions are slow; a cell inside a large STL starts from all facets"

[[feature]]
id = "m2-stl"
title = "M2 STL import and convex STL meshing"
requirements = ["M2", "GEO-02"]
grade = "partial"
how = "Unit and skewed boxes against the analytic box; malformed, inward, nonconvex and non-manifold shells rejected"
tests = [
  "tests/stl_workflow.rs::triangulated_box_matches_the_analytic_box",
  "tests/stl_workflow.rs::skewed_box_clips_against_the_surface_and_exports",
  "tests/stl_workflow.rs::invalid_stl_shells_are_rejected",
  "crates/mesh-mcp/tests/stdio.rs::stl_tools_reuse_check_and_export_for_a_skewed_surface",
]
commands = []
gaps = "Convex surfaces only; size control: see the next row"

[[feature]]
id = "m2-size-control"
title = "M2 size control: size field from datum objects and coordinate regions, CVT seeding (ALG-05)"
requirements = ["ALG-05", "GRD-01", "GRD-02", "GRD-03", "GRD-05", "GRD-08"]
grade = "partial"
how = "Exact distances of every shape and the field's slope bound by unit tests; graded meshes on the unit and skewed boxes validate, the median cbrt(V)/h is within 5 % of 1 with p10 and p90 within 15 %, each source's cells reach its size within 10 % (median), equal inputs give equal meshes, the estimate equals the build, and edited evidence fails the digest; benchmark against DistMesh springs in research/m2-size-control.md"
tests = [
  "crates/mesh-algorithms/src/sizing/field.rs::shape_distances_are_exact",
  "crates/mesh-algorithms/src/sizing/field.rs::the_field_is_a_clamped_gradation_limited_minimum",
  "crates/mesh-algorithms/src/sizing/mod.rs::uniform_count_and_determinism",
  "crates/mesh-engine/tests/size_field.rs::size_field_grades_the_stl_mesh_and_reports_each_source",
  "crates/mesh-engine/tests/size_field.rs::every_shape_grades_an_angled_surface",
  "crates/mesh-engine/tests/size_field.rs::invalid_size_fields_are_diagnosed",
  "crates/mesh-cli/tests/kofl.rs::estimates_match_the_built_cell_counts",
]
