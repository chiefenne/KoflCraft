[[feature]]
id = "duct-shells"
title = "Zero-thickness shells on the nonconvex duct path (SHL-01 to SHL-03)"
requirements = ["SHL-01", "SHL-02", "SHL-03"]
grade = "partial"
how = "In a round pipe (r = 5, 48-gon wall) a half baffle from the wall to a free edge and a tilted plate with free edges all round go into the tet scaffold of the median-dual core: the wall is cut along each shell before the remesh, each shell is meshed by a 2D constrained Delaunay at the local size, its triangles are recovered in the scaffold and the scaffold is cracked into two sides; both sides are wall patches (`<shell>`, `<shell>_back`) of equal area, the plate covers its polygon exactly, the baffle the pipe section on its side within 1 %, the volume holds within 0.5 % and none of the 135k cells fails the solver rules; the wall layers run into the shell and stop at its free edges. Each shell has its own size (default: an eighth of its narrow width, half that on the free edges) in the build's size field, is graded from its wall-line edges and splits encroached boundary edges: the 4 x 3 plate goes from 12 to 390 triangles (angles above 35 degrees) and the baffle's smallest angle from 4.5 to 15.4 degrees. On the Voronoi core the finished cells are cut exactly instead, with the same areas. A shell over a port cap, two shells that meet and a shell in a wall facet are refused with the shell's name; shell.add/list/remove add a shell by name, refuse a repeated name, a nonconvex polygon and a shell touching another, list the default sizes from the STL, and replay from the journal"
tests = [
  "crates/mesh-engine/tests/shell_duct.rs::a_half_baffle_and_a_plate_in_the_scaffold",
  "crates/mesh-engine/tests/shell_duct.rs::a_half_baffle_and_a_plate_cut_into_the_voronoi_core",
  "crates/mesh-algorithms/src/shell_surface.rs::plate_and_spanning_baffle_in_a_box",
  "crates/mesh-algorithms/src/shell_surface.rs::caps_crossing_and_coplanar_shells_are_refused",
  "crates/mesh-algorithms/src/planar.rs::constraints_are_recovered_and_regions_split",
  "crates/mesh-algorithms/src/duct/volume_dual.rs::crack_doubles_the_shell_and_keeps_its_free_edge",
  "crates/mesh-algorithms/src/duct/volume_dual.rs::crack_refuses_a_shell_on_the_fluid_boundary",
  "crates/mesh-algorithms/src/duct/shell.rs::a_plate_with_free_edges_covers_its_polygon",
  "crates/mesh-algorithms/src/shell_surface.rs::narrow_width_and_size_items_of_a_shell",
  "crates/mesh-cli/tests/kofl.rs::shell_tools_add_list_and_remove_shells",
]
commands = []
gaps = "Shells may meet walls only: a shell over an inlet or outlet cap and shells that touch each other are refused for now; planar convex polygons only; no prism layers on the shells (SHL-04); the report names both sides, but the hand-off evidence does not pair them yet and `foehn` does not read them (FC-11); Polyhedral mode with a Rust-built median-dual scaffold (the Voronoi core takes the exact cut, which needs convex cells); the smallest shell triangle angle is 15.4 degrees on the test baffle, where the wall line ends 0.05 from a kink of the 48-gon (wall-line edges are split once at most, to keep the wall triangles beside them sound); shell sizes apply to the median-dual scaffold only (the Voronoi core's cut follows its cells); not run on the jacket, furnace or Manifold"

