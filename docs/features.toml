[[feature]]
id = "block-mb1g-multi-element"
title = "Block-structured variant MB1g: multi-element airfoil template (slat, main element, flap; extruded H-grid)"
requirements = ["BS-03", "BS-09", "BS-12"]
grade = "partial"
how = "block.template with multi_element_airfoil: each element a NACA 4-digit section or a Selig/Lednicer file, blunt trailing edge (0.5 % chord), placed by chord, deflection, gap (closest distance, fraction of the main chord) and negative overlap; an H-grid of 2E+1 columns and four rows around a wall ring per element (six blocks, 5 % of its chord thick, the wall offset along its normals, cells growing by at most 1.2), with a cove where the next element's nose sits below the chord, spline walls, and gap edges that leave each trailing edge toward the next element. The blocks off the rings then go through the layout optimisation (block::layout, after Sauer & Morsbach 2023): vertices slide along the box or move freely, interior edges bend by two Hermite modes, Tanh/Geometric end spacings scale, minimising the face non-orthogonality and growth of the TFI grid by a pattern search (Hooke & Jeeves 1961); the result's layout entry reports before and after. A check refuses a TFI grid that still folds, naming the gap to change. Nine cases (research/block-layout-optimisation.md): max non-orthogonality 76-89° (58-240 cells over 70°, two cases refused) became 47.4-68.2° with no cell over 70° and no fold, at 0.5-2.5 s per template. Slat 25° (gap 0.05, overlap -0.04), flap 30° (gap 0.03, overlap -0.02), 64 surface cells: TFI 54.72°/14.46° max/mean, elliptic 54.85°/14.23° converged in 1,310 sweeps (34 s; was 40,000 sweeps, 6 min), wall angle max/mean 44.9°/4.6°. Elliptic smoothing on this template uses decay 0.8 and up to 40,000 sweeps"
tests = [
  "crates/mesh-algorithms/src/block/tests.rs::multi_element_airfoil_places_and_conforms",
  "crates/mesh-algorithms/src/block/layout.rs::layout_straightens_a_leaning_edge_along_the_boundary",
  "crates/mesh-algorithms/src/block/layout.rs::layout_keeps_blocks_on_rigid_patches",
  "crates/mesh-cli/tests/kofl.rs::block_templates_build_an_elbow_and_an_airfoil_from_a_file",
]
commands = ["kofl call block.template", "kofl call block.grid"]
gaps = "Overlapping elements (slot topology) are refused; the worst angles left sit in the gap blocks and at the box top (the layout has no triangle blocks, so the MB1h trigger adds no split there); the largest growth across a face (17 to 28) sits at the ring's blunt trailing-edge corner cells, which the optimiser does not move; the optimiser works on extruded topologies only (as a tool: block.optimize_layout, MB1h); the template's smoothing settings are lost once an edit drops the reference; not in the acceptance runner yet"

[[feature]]
id = "block-mb1h-triangle-split"
title = "Block-structured variant MB1h: triangle split (tri-center) with an automatic trigger; tetrahedron and prism as hexahedra"
requirements = ["BS-03", "BS-05", "BS-13"]
grade = "partial"
how = "block.split_triangle splits a block with a corner of at least 120° into three blocks around a centre of valence 3 (side i-j gets n_i + n_j cells); the new count enters as a row that runs through the neighbouring blocks to the boundary (sheet insertion), new vertices on the edges' own curves and laws, halves fitted to the old grid, patches kept. block.optimize_layout runs the MB1g layout optimiser on any extruded topology and, by default, the trigger: every corner of 150° or more in the layout before optimisation is tried (split, then optimised with the growth held at the larger of 2 and the start growth) and kept only when its blocks' worst angle drops by 2° or more while the grid's worst angle, cells over 70°, folds and growth get no worse; kept and skipped corners are reported with the reason. The multi_element_airfoil template runs the trigger too. block::tri_center builds a prism as three hexahedra and a tetrahedron as four (edge midpoints, face centroids, body centroid; shared points made once, either orientation), with templates triangle and tetrahedron. A 171° triangle beside a quadrilateral: 61.9° after plain optimisation, 26.2° with the kept split, growth 2.0, 0.2 s; the nine MB1g airfoil cases have no 150° corner and stay unchanged (research/block-triangle-split.md). 3D (step 1 of the 3D insertion plan): the split works on any topology and any block frame; with `along` (or the flattest edge at the vertex) the flat block edge picks the prism's axis, every block stacked along it (its column) becomes three, and the new count is a sheet that runs from the column through the neighbouring blocks to the boundary; flat_edges finds prism-shaped blocks (an edge flatter than 150° at both ends)"
tests = [
  "crates/mesh-engine/src/block_triangle.rs::a_triangle_becomes_three_blocks_and_a_row",
  "crates/mesh-engine/src/block_triangle.rs::the_trigger_keeps_a_split_that_helps",
  "crates/mesh-engine/src/block_triangle.rs::the_trigger_leaves_a_layout_without_triangles_alone",
  "crates/mesh-engine/src/block_triangle.rs::the_growth_hold_keeps_the_size_ratio",
  "crates/mesh-engine/src/block_triangle.rs::a_split_is_refused_off_a_triangle",
  "crates/mesh-engine/src/block_triangle.rs::a_triangle_runs_through_its_column",
  "crates/mesh-engine/src/block_triangle.rs::the_split_works_in_any_frame",
  "crates/mesh-algorithms/src/block/tri_center.rs::a_tetrahedron_becomes_four_hexahedra",
  "crates/mesh-algorithms/src/block/tri_center.rs::two_tetrahedra_share_their_face",
  "crates/mesh-algorithms/src/block/tri_center.rs::a_triangle_becomes_a_prism_of_three_hexahedra",
  "crates/mesh-cli/tests/kofl.rs::tri_center_tools_split_blocks_and_build_meshes",
]
commands = ["kofl call block.split_triangle", "kofl call block.optimize_layout", "kofl call block.template"]
gaps = "The 2D trigger with layout optimisation works on extruded topologies only; off the z plane block.optimize_layout runs the 3D trigger without layout optimisation (feature block-3d-trigger); a column that closes into a ring is refused; the new count enters as a full sheet or stops at T-junctions with a count solve (feature block-t-junctions); a tet-shaped block of a 3D topology is split by block.split_tet (feature block-tet-split); a corner of exactly 180° cannot be stored (the check refuses the block); the trigger tries at most four corners per round, one layout optimisation each; no template uses a triangle layout yet (the multi-element gaps have none); not in the acceptance runner yet"

[[feature]]
id = "block-3d-trigger"
title = "3D trigger of the prism split: candidates by geometry, kept only when a measured 3D trial is better"
requirements = ["BS-20", "BS-13"]
grade = "partial"
how = "block.optimize_layout on a topology that is not extruded along z (or has T-junctions) runs the 3D trigger instead of the 2D layout optimiser: candidates are the flat block edges (150 degrees or more at both ends), each is split with the T-junction stop and with the sheet, the TFI grid is measured in 3D (finite-volume non-orthogonality and growth across every inner hex face, scaled Jacobian of every corner, per block and whole), and a trial is kept when its blocks' worst angle drops by 2 degrees or more, their worst scaled Jacobian reaches 0.4 and is no worse, and the grid's worst angle, cells over 70 degrees, folds, growth and cell count (at most +10 %) stay in bounds; the better row end wins (gain, then fewer cells). The wedge turned off the z plane: 48.4 to 30.0 degrees, scaled Jacobian 0.16 to 0.52, T-junction end kept (126 cells against 150); with the default cap the same split is left because it adds 54 of 72 cells, and the report says so for both row ends (research/block-triangle-split.md)"
tests = [
  "crates/mesh-engine/src/block_insert.rs::the_3d_trigger_keeps_a_prism_split_that_helps",
  "crates/mesh-engine/src/block_insert.rs::the_3d_trigger_respects_the_cell_cap",
  "crates/mesh-engine/src/block_insert.rs::the_3d_trigger_keeps_a_tet_split_that_helps",
  "crates/mesh-algorithms/src/block/tests.rs::channel_measures_orthogonal_in_3d",
]
commands = ["kofl call block.optimize_layout"]
gaps = "No 3D layout optimiser (the trial judges the TFI grid as it comes); tet splits are tried too (feature block-tet-split); the cell cap (10 % of the grid) is fixed, not a tool input; the trigger tries at most four candidates per round and four splits; not run on a swept or junction fixture yet"

[[feature]]
id = "block-tet-split"
title = "Tet split of a block: a tetrahedron-shaped hex block becomes four hexahedra, its neighbours prism columns"
requirements = ["BS-20", "BS-21", "BS-05"]
grade = "partial"
how = "block.split_tet finds the frame where three faces at a corner P0 are triangles with one flat corner each (150 degrees or more for the detection, 120 by hand, and nearly flat at v6) and splits the block into the four hexahedra of the tetrahedron: corner counts n1, n2, n3 are the block's counts, the face P1P2P3 keeps its grid, n0 (the mean of the counts when absent) is added to the three edges at P0, each triangle's centre sits at the mean of its three edge points (convex quads), the tet's centre at the mean of the face centres. Conformal (maintainer card 2026-11-27 \"Conformal, prism columns\"): a block on one of the three triangles is split into three with it, a triangle split along its edge away from the tet with every block stacked on it, all columns and the tet share one new row (block_triangle::split_prisms), which runs on through blocks on the edges at P0 as a sheet or stops there with T-junctions and the count solve. The 3D trigger of block.optimize_layout tries tet-shaped blocks too. Tet fixture: scaled Jacobian 0.04 to 0.49, worst angle 81.6 to 50.8 degrees, 33 cells over 70 degrees to none, 240 to 880 cells (tet on a slab); no folds (research/block-triangle-split.md)"
tests = [
  "crates/mesh-engine/src/block_tet.rs::a_tet_shaped_block_is_found",
  "crates/mesh-engine/src/block_tet.rs::a_tet_becomes_four_hexahedra",
  "crates/mesh-engine/src/block_tet.rs::a_neighbour_on_the_fourth_face_stays_conformal",
  "crates/mesh-engine/src/block_tet.rs::a_neighbour_on_a_triangle_becomes_a_prism_column",
  "crates/mesh-engine/src/block_tet.rs::the_row_runs_on_through_a_block_on_an_edge_at_p0",
  "crates/mesh-engine/src/block_insert.rs::the_3d_trigger_keeps_a_tet_split_that_helps",
]
commands = ["kofl call block.split_tet", "kofl call block.optimize_layout"]
gaps = "A block on a triangle must be prism-shaped along its edge away from the tet (its far corner 120 degrees or more); two columns that meet, or a row that would enter a block from both ends, are refused; the face and tet centres are straight averages (not projected onto a curved face); the cell cap of the trigger blocks the split on small fixtures; the split falls back to a non-conformal interface where a neighbour is not prism-shaped (block-non-conformal-join); not run on a swept or chamfered-corner fixture yet; not in the acceptance runner yet"

[[feature]]
id = "block-non-conformal-join"
title = "Non-conformal block interfaces: a split piece keeps its counts, the two grids on the shared face are overlaid into polyhedra"
requirements = ["BS-16", "BS-20", "BS-13"]
grade = "partial"
how = "block.split_tet with join auto (default, card A 2026-11-28) falls back to a non-conformal interface when a block on a triangle cannot take a prism column: the neighbour stays whole, its face becomes the coarse patch and the tet's three parts the fine patch of one interface, and n0 is the coarsest count from half the tet's largest count up whose four hexahedra reach a scaled Jacobian of 0.4 (cards C and E; n0 = 3 gave 0.35, 4 gives 0.43). The 3D trigger of block.optimize_layout tries tets with the same automatic join, so it keeps this split too. The grid joins each interface in the coarse face's grid parameters: fine nodes by inverting its bilinear quads, the two quad tilings overlaid as a planar arrangement with exact orientation predicates and a 2 % snap (card B; block/overlay.rs, Farrell et al. 2009, Cherchi et al. 2020), each overlap polygon one internal face, the points inside every edge put into all faces at that edge. Tet on a box: 462 cells, 57 polyhedra, 113 interface faces, 0 inverted faces, cells closed, polyhedral volume equal to the hexahedra's to 1e-9. volume.vtu and foehncraft.vtu hold the polyhedra, mesh.msh hexahedra plus pyramids and tetrahedra per polyhedron with parents (card D) (research/non-conformal-block-join.md)"
tests = [
  "crates/mesh-algorithms/src/block/overlay.rs::distinct_grids_give_the_product_of_columns_and_rows",
  "crates/mesh-algorithms/src/block/overlay.rs::shared_lines_merge_exactly",
  "crates/mesh-algorithms/src/block/overlay.rs::skewed_cells_conserve_area_and_order_edge_points",
  "crates/mesh-algorithms/src/block/overlay.rs::tri_center_sub_faces_overlay_a_full_grid",
  "crates/mesh-algorithms/src/block/overlay.rs::cells_with_edge_points_close_on_their_faces",
  "crates/mesh-algorithms/src/block/overlay.rs::snap_removes_near_coincident_slivers",
  "crates/mesh-algorithms/src/block/overlay.rs::different_regions_are_refused",
  "crates/mesh-engine/src/block_tet.rs::a_box_neighbour_joins_non_conformally",
  "crates/mesh-engine/src/block_insert.rs::the_3d_trigger_falls_back_to_a_non_conformal_tet_split",
]
commands = ["kofl call block.split_tet", "kofl call block.optimize_layout", "kofl call block.grid"]
gaps = "Tet split only (the prism split is still conformal); the trigger's quality measure does not see the interface faces; coarse side must be one whole block face; only flat interface faces tested (curved faces carry a gap between the two sides, reported as max_gap); not in the acceptance runner yet"

[[feature]]
id = "block-t-junctions"
title = "Block T-junctions: coarse faces gridded first, count solve with sum rules, triangle split that stops at the neighbours"
requirements = ["BS-21", "BS-05", "BS-20"]
grade = "partial"
how = "A topology lists junctions (edge a-b through vertices); the check requires every piece to be a block edge and the counts to add up, and finds coarse faces that faces of other blocks tile in strips. The grid builder grids coarse faces first (whole edges joined from the pieces, interior by TFI) and stores their strips and cuts, so the blocks on both sides share every node: a T box (one block beside two) conforms with the volume exact, and the whole-edge count must equal the pieces' sum. block::counts::fit fits one integer per chain to target counts with the sum rules (integer kernel by column Hermite reduction, least squares, rounding, lattice moves). block.split_triangle with stop t_junction keeps the neighbours whole: on the two-layer wedge 8 blocks and 126 cells against 10 blocks and 150 for the sheet split, 3 junctions, the grid conforms (hand-off) and keeps the volume (research/block-triangle-split.md, step 2)"
tests = [
  "crates/mesh-algorithms/src/block/tests.rs::t_junction_faces_conform",
  "crates/mesh-algorithms/src/block/tests.rs::t_junction_counts_must_add_up",
  "crates/mesh-algorithms/src/block/tests.rs::bad_junctions_are_refused",
  "crates/mesh-algorithms/src/block/tests.rs::count_solve_makes_the_t_junction_add_up",
  "crates/mesh-algorithms/src/block/counts.rs::kernel_vectors_solve_the_sums",
  "crates/mesh-algorithms/src/block/counts.rs::lattice_fit_shares_out_the_mismatch",
  "crates/mesh-engine/src/block_triangle.rs::a_t_junction_split_keeps_the_neighbours_whole",
]
commands = ["kofl call block.split_triangle", "kofl call block.check", "kofl call block.grid"]
gaps = "Strip covers only (no face split both ways, no vertex inside a coarse face); elliptic smoothing, the layout optimiser and the edits that add, remove or split blocks or set chain counts refuse T-junctions; the 2D trigger of extruded layouts does not try the T-junction split (the 3D trigger does); no tetrahedron insertion yet (part 3); not in the acceptance runner"

[[feature]]
id = "regions-field-proposal"
title = "Field-guided region proposal for block-dominant meshing (regions.propose)"
requirements = ["BS-18", "BS-17"]
grade = "partial"
how = "regions.propose builds a tet scaffold of a closed STL (wall remesh, Delaunay scaffold), solves the heat-method wall distance (Crane et al. 2013, t = (3h)^2) and the potential 0 at inlets, 1 at outlets (no flux at walls, symmetry), and cuts the potential into slabs about two edge lengths thick; the connected pieces of the slabs are the Reeb graph (skeleton) with end and branch points, placed on the ridge faces of the distance (grad d flips). Pieces with two pieces above or below are junctions; pieces with four times the median section area (flux sum V |grad p| over the slab's potential step, exact for any section) are boxes (chambers), unless their run is four equivalent diameters long (a wide duct); clean runs (clash c = |cos(grad d, grad p)| >= 0.5 on less than 30 % of the volume) are sweeps when their level sets meet the wall in one closed loop, also on a loop of the graph (parallel tubes between headers), and obstacles when a second closed loop shows a body inside; clashing runs and clash clusters above 0.5 % of the volume are remainder. The second pass classifies each box and remainder region again with its Fiedler vector (own long axis) in place of the potential. T and Y (fork) ducts: one branch point, three ends, sweeps above 0.6 and 0.7; elbow: one sweep, two ends, 99.5 % blockable; Manifold: chamber 66 % box, second pass finds sweeps for 36 % of the domain inside it; three and five parallel tubes between headers and the heat exchanger's seven tubes are sweeps; a round reducer (area ratio 2.8) is one sweep (by volume its wide pipe was a box); the furnace chamber with its tubes is an obstacle (research/field-region-proposal.md)"
tests = [
  "crates/mesh-engine/tests/regions.rs::tee_has_one_junction_and_three_ends",
  "crates/mesh-engine/tests/regions.rs::fork_has_one_junction",
  "crates/mesh-engine/tests/regions.rs::elbow_is_one_sweep",
  "crates/mesh-engine/tests/regions.rs::map_without_outlet_is_refused",
  "crates/mesh-engine/tests/regions.rs::manifold_chamber_is_a_box_the_second_pass_splits",
  "crates/mesh-engine/tests/regions.rs::parallel_tubes_are_sweeps",
  "crates/mesh-engine/tests/regions.rs::reducer_is_one_sweep",
  "crates/mesh-engine/tests/regions.rs::furnace_chamber_with_a_tube_is_an_obstacle",
  "crates/mesh-algorithms/src/fields/regions.rs::straight_duct_is_one_sweep",
  "crates/mesh-algorithms/src/fields/mod.rs::potential_of_a_straight_duct_is_linear",
  "crates/mesh-algorithms/src/fields/mod.rs::heat_distance_peaks_on_the_axis",
  "crates/mesh-algorithms/src/fields/mod.rs::fiedler_follows_the_long_axis",
]
commands = ["kofl call regions.propose"]
gaps = "Proposal only, nothing is meshed; a chamber that is the whole domain (the furnace) is an obstacle, not a box, because box means much wider than the median slab; the box test compares section areas, so a reducer with an area ratio of 4 or more reads as a box unless its wide run is four diameters long; the second pass labels are noisy on small clash zones; no cross-section shape (O-grid or H) is chosen yet; Jacobi-preconditioned CG only (fine up to about 10^6 nodes); one scaffold spacing for the whole domain"

[[feature]]
id = "regions-sweep-fill"
title = "Sweep regions filled with swept O-grids along the flow potential (regions.fill)"
requirements = ["BS-18", "BS-03", "BS-17"]
grade = "partial"
how = "regions.fill takes the sweep regions of regions.propose and meshes each with hexahedra: stations on level sets of the inlet-to-outlet potential at equal centreline spacing, ends at the port or at a calm cut (wall loop flat to 0.001 of the diameter, tilt at most 0.5 deg) before the next region, a station pinned to each sharp wall edge across the flow (the mitre plane), each round section the pipe O-grid (ring corners at 45 deg + 90 deg m of a rotation-minimising frame, Wang et al. 2008), each rectangular section an H-grid (the wall layers, then a tensor core clustered to all four walls by a mirrored geometric law, growth at most 1.25), wall rows at the layer heights, interior nodes moved along the station normal onto the level set by a bounded root search; ports and cuts are exactly planar. Next to each mitre plane the stations are blended planes (normals turned by slerp from the leg section to the mitre plane over z >= 3 r theta / spacing stations, the classical structured mitre). Elbow: 39,468 hexahedra port to port (H-grid), volume -0.002 %, no inverted face, min scaled Jacobian 0.49, non-orthogonality 49.5 deg at the mitre and 26.6 deg in the legs (O-grid: 59.1 and 45 deg; level sets at the mitre: 66.1 deg); Manifold: both pipes swept (69,632 hexahedra) to calm planar cuts, min scaled Jacobian 0.70, the box (75 %) left for the polyhedral mesher; S-bends, round and square, and round reducers are swept end to end (research/sweep-fill.md)"
tests = [
  "crates/mesh-engine/tests/fill.rs::elbow_sweeps_through_the_mitre",
  "crates/mesh-engine/tests/fill.rs::manifold_pipes_end_in_calm_cuts",
  "crates/mesh-engine/tests/fill.rs::mitre_blend_beats_the_level_sets",
  "crates/mesh-engine/tests/fill.rs::h_grid_beats_the_o_grid",
  "crates/mesh-algorithms/src/fields/sweep.rs::volume_below_a_level_is_exact",
  "crates/mesh-algorithms/src/fields/sweep.rs::lift_stays_within_reach",
  "crates/mesh-algorithms/src/fields/sweep.rs::geometric_rows_keep_first_height_and_length",
  "crates/mesh-algorithms/src/fields/sweep.rs::hex_measures_of_a_cube",
]
commands = ["kofl call regions.fill", "cargo m1 --require-foehn (fill: the elbow read back by FoehnCraft)"]
gaps = "The region behind the cuts is joined as polyhedra (feature regions-sweep-join); the square O-grid section has 45 deg at its diagonals in straight legs, which adds to the mitre tilt (59 deg on the elbow); a sweep needs one closed wall loop per level set and one section type throughout; section rows are not smoothed"

[[feature]]
id = "regions-sweep-join"
title = "Region behind the sweep cuts meshed as polyhedra and joined conformally at the cuts (regions.fill join)"
requirements = ["MD-25", "BS-17"]
grade = "partial"
how = "regions.fill with join (default): each cut gives the polyhedral mesher a planar cap, the preimage of the cut section under the mesher's cap similarity (x -> c + (x - c)(1 - H/r)), its quads split by the Delaunay diagonal, and the cut's layer rows move to the mesher's layer nodes, so the pipe adapts and the mesher is unchanged. The STL is cut at the ring of plane-crossing facets around each rim, the sweep side dropped by a flood, the hole zipped to the cap rim (Fuchs, Kedem & Uselton 1977), and the closed surface meshed by the median dual with the sweeps' layer stack. The cap points weld to the cut nodes, each hex face of a cut is replaced by the polyhedral cap faces it holds (area checked), and the points on hex-face edges are spliced into the neighbouring faces. Manifold: 133,056 cells (69,632 hexahedra, 63,424 polyhedra), 0 inverted faces, weld 8e-14, area match 3e-12, non-orthogonality at the cuts 49.7 deg (research/sweep-fill.md, step 2). More than two openings: each connected cap of a port id gets its own similarity, cuts past two share an id and the join tells them apart by their planes; STL nodes within a quarter of the rim spacing in front of a cut go with the sweep, so the strip has no needles. Three-pipe box: 105,638 cells, 0 inverted faces, closure 6.8e-15, 47.3 deg at the cuts, FoehnCraft reads it as valid. Square cuts: H-grid caps (wall nodes slid onto the scaled core lines, Delaunay) and the wall layers within four stacks of a cap take its sideways shift (smoothstep), so the square T (80,389 cells, 41.4 deg at the cuts) and fork join at five layers. Tubes cut at both ends: every cut's band is marked before the sweep sides are flooded (the flood from one end stops at the other's band), and each closed shell behind the cuts gets its own polyhedral mesh, joined in turn; a round pipe between two boxes joins both boxes (two shells), and the heat exchanger tube side (seven tubes, two bonnets, fluid made with Gmsh from the STEP) joins as 1,371,578 cells, 0 inverted faces, 50.1 deg at the cuts. The strip never folds inward: the zip never takes the triangle that faces the axis when the other does not, and restarts from another hole node when its forced last steps fold one; five round tubes between two box headers (coarse Gmsh STL) join as 419,287 cells, 0 inverted faces, 50.3 deg at the cuts"
tests = [
  "crates/mesh-engine/tests/fill.rs::manifold_box_joins_the_pipes",
  "crates/mesh-algorithms/src/fields/remainder.rs::cut_duct_is_closed_by_its_cap",
  "crates/mesh-algorithms/src/fields/remainder.rs::a_duct_beside_the_cut_stays",
  "crates/mesh-algorithms/src/fields/remainder.rs::a_ring_next_to_the_plane_goes_with_the_sweep",
  "crates/mesh-algorithms/src/fields/remainder.rs::a_steep_hole_edge_does_not_fold_the_strip",
  "crates/mesh-engine/tests/fill.rs::pipe_box_joins_three_openings",
  "crates/mesh-engine/tests/fill.rs::square_tee_and_fork_join",
  "crates/mesh-engine/tests/fill.rs::pipe_between_two_boxes_joins_both",
  "crates/mesh-tools/src/regions.rs::next_step_names_what_the_file_holds",
]
commands = ["kofl call regions.fill", "cargo m1 --require-foehn (fill: elbow and joined Manifold read back by FoehnCraft)"]
gaps = "Long thin rectangular cuts fail (one similarity per cap, scaled by the short side), no symmetry planes behind the cuts; a square branch flush with a wall of the box behind it fails (layer front collision, or the build does not finish); the box keeps the polyhedral mesher's own quality (85 to 89 deg inside the Manifold box and the bonnets)"
