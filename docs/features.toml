requirements = ["BC-03"]
grade = "partial"
how = "On the 90,894-facet Manifold surface the two best candidates are exactly the hand-recorded port caps; on the synthetic cooling jacket both 96-gon caps score 1.000 against 0.57 for a block face, the map passes BC-06 and the setup lengths follow the port radius; a map with two inlets or a symmetry patch is refused; the elbow's port file and the same ports as a map give the same bulk mesh"
