gaps = "The gradation bounds the field; about 10 % of neighbour pairs exceed it on the cells and are reported. STL surface and closed-body datum objects open; convex domains only; fields may ask for at most 200,000 seeds; geometry-derived sources: see the next row"

[[feature]]
id = "m2-geometry-sizing"
title = "M2 geometry-derived sizes: wall curvature, gaps between opposite walls, feature edges (GRD-04)"
requirements = ["GRD-04", "GRD-08"]
grade = "partial"
how = "Normal-cycle curvature within 2.5 % of 1/R on an icosphere and 0.1 % on a CAD-style strip cylinder, zero on flat facets, and cube edges found as the twelve features, by unit tests; medial-ball and ray thickness exact on a slab; the pruned size envelope equals brute force; built and validated meshes put at least 3 cells across a thin slab (counted along the wall normals), reach angle·R on a strip cylinder's wall within 10 % and the edge size along a box's edges within 15 % (median); benchmark of the normal-cycle tensor against cotangent and normal-deviation curvature, and of the medial ball against the ray cast, in research/grd-04-geometry-sizing.md"
tests = [
  "crates/mesh-algorithms/src/sizing/surface.rs::distances_and_envelope_equal_brute_force",
  "crates/mesh-algorithms/src/sizing/surface.rs::normal_cycle_curvature_recovers_known_radii",
  "crates/mesh-algorithms/src/sizing/surface.rs::thickness_and_gap_sizes",
  "crates/mesh-engine/tests/geometry_sizing.rs::gap_source_puts_cells_across_a_thin_slab",
  "crates/mesh-engine/tests/geometry_sizing.rs::curvature_source_refines_the_curved_wall",
  "crates/mesh-engine/tests/geometry_sizing.rs::feature_edges_refine_the_box_edges",
  "crates/mesh-engine/tests/geometry_sizing.rs::invalid_geometry_sources_are_diagnosed",
]
commands = []
gaps = "Convex domains only, where Euclidean distances and the closed-form thickness are exact; nonconvex domains (M4) need the shrinking-ball search and distances through the domain. Cells across a tapering gap are discrete: on a 30° wedge about 5 % of wall samples get one cell fewer than asked, and the result reports them; where a gap needs cells below min_size the target is not met and is reported. Per-facet curvature, no anisotropy (GRD-06)"

