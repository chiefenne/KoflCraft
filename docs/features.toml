grade = "partial"
how = "A remeshed sphere stays within the chord tolerance both ways with edges at the chord length; a box keeps its twelve feature edges, eight corners, kept facets and exact volume; exact orientation and in-sphere signs on coplanar and cospherical input; a Delaunay grid has empty spheres and fills its box; scaffolds of a sphere and a nonconvex box pair every interior face, use every wall triangle once and fill the enclosed volume to 1e-12; the Manifold wall built from the STL is within 0.05 of it both ways and its polyhedral mesh is valid in the hand-off"
tests = [
  "crates/mesh-algorithms/src/remesh.rs::sphere_meets_the_chord_tolerance",
  "crates/mesh-algorithms/src/remesh.rs::box_keeps_features_and_kept_facets",
  "crates/mesh-algorithms/src/predicates.rs::orientation_signs_are_exact",
  "crates/mesh-algorithms/src/predicates.rs::insphere_signs_are_exact",
  "crates/mesh-algorithms/src/delaunay.rs::grid_is_delaunay",
  "crates/mesh-algorithms/src/scaffold.rs::sphere_scaffold_fills_the_wall",
  "crates/mesh-algorithms/src/scaffold.rs::nonconvex_box_is_recovered",
  "crates/mesh-cli/tests/workflow.rs::nonconvex_elbow_preserves_volume_and_exposes_each_port_layer",
  "crates/mesh-cli/tests/workflow.rs::nonconvex_manifold_preserves_volume_and_exposes_each_port_layer",
]
commands = []
gaps = "Ports are kept as they are (the elbow, with two-triangle ports, keeps its Gmsh scaffold); scaffold mean ratio floor 0.05 against Gmsh's 0.26, no vertex smoothing; features by dihedral angle only; a finer wall makes the Manifold mesh 2.4 times larger and its build about 3 minutes"

