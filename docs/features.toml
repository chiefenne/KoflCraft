[[feature]]
id = "no-layers"
title = "Wall patches without layers: layers run straight into them (BC-01)"
requirements = ["BC-01"]
grade = "partial"
how = "`no_layers` in the partition names planar wall patches that grow no layers; the layers of the walls around end on them, their side faces in that plane, and the patch's own facets slide in its plane to make room (harmonic in-plane offset). The furnace fixture's side walls: tube layers end on them, every patch area within 1% (tube 3%) of the STL; the seven-tube furnace with about 24 faces around each tube has 1,895,630 cells, passes the solver rules, and FoehnCraft reads it as valid (max non-orthogonality 74.9°)"
tests = [
  "crates/mesh-cli/tests/workflow.rs::flush_openings_grow_layers_and_every_patch_keeps_its_name",
]
commands = []
gaps = "Median dual core only; each connected piece must be planar; two such patches meet only in one plane and never at an inlet or outlet cap (`layers_yield` keeps the layers of such a wall)"

[[feature]]
id = "layers-yield"
title = "Walls whose layers yield: crossing walls' layers run straight through (BC-01)"
requirements = ["BC-01"]
grade = "partial"
how = "`layers_yield` in the partition names planar wall patches that keep their layers while every wall crossing them runs its own layers straight through down to them, with no mitre. The duct is built with those planes moved in by the layer height (a linear ramp over four layer heights in front of them), then each face on a moved plane is extruded back through the layer heights: under core cells these are the wall's own layers, under a tube's layer columns a block of (tube layer x side layer) hexahedra. On the furnace fixture all six patches are layered, the side wall area matches the STL to 0.1%, and the mesh passes the solver rules and FoehnCraft's checks"
tests = [
  "crates/mesh-cli/tests/workflow.rs::yielding_side_walls_keep_layers_under_the_crossing_walls",
]
commands = []
gaps = "Median dual core with a built scaffold only; each connected piece must be planar; walls within four layer heights of it must meet it at a right angle (within about 6 degrees); two yielding walls must not meet; one yield level, no general priority order"

[[feature]]
id = "patch-proposals"
title = "Patch proposals and the FoehnCraft boundary-condition skeleton (BC-03, BC-05)"
