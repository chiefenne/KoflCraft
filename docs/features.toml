[[feature]]
id = "block-mb1d-smoother"
title = "Block-structured variant MB1d: elliptic smoother with frozen TFI residual, symmetry sliding and line Gauss–Seidel"
requirements = ["BS-08", "BS-09", "BS-12"]
grade = "partial"
how = "The residual of the Thompson–Thames–Mastin system at the TFI grid is frozen, so TFI is a fixed point and only the Steger–Sorenson wall controls move nodes; interior block vertices and inner block edges move; nodes on planar symmetry patches slide in the plane with mirror ghost points; line Gauss–Seidel with the axis turning every sweep. FoehnCraft max non-orthogonality: pipe 23.3° (TFI 23.4°), elbow 23.45° (TFI 23.7°, MB1b smoother 34.5° to 38.7°); wall angle max pipe 3.12° → 0.44°, elbow 3.17° → 0.63°; extruded NACA 2412 C-grid with one span cell now smoothed: wall angle max 60.4° → 34.5°, non-orthogonality 60.4° → 55.9°, skewness 0.267 → 0.155. The acceptance runner builds pipe, elbow and an extruded NACA 2412 C-grid with TFI and elliptic smoothing, has FoehnCraft read each VTU and MSH back against the evidence, and fails if smoothing raises the max non-orthogonality FoehnCraft measures (first run: pipe 23.39° → 23.30°, elbow 23.77° → 23.58°, airfoil 60.54° → 47.00°)"
tests = [
  "crates/mesh-algorithms/src/block/tests.rs::smoothing_keeps_a_stretched_channel",
  "crates/mesh-algorithms/src/block/tests.rs::pipe_walls_become_orthogonal",
  "crates/mesh-algorithms/src/block/tests.rs::elbow_smoothing_is_not_worse_than_tfi",
  "crates/mesh-algorithms/src/block/tests.rs::sliding_nodes_stay_on_their_plane",
  "crates/mesh-engine/src/block.rs::airfoil_cgrid_validates_and_smooths",
]
