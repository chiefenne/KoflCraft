  "crates/mesh-engine/tests/ports.rs::detection_recovers_the_hand_recorded_manifold_ports",
  "crates/mesh-engine/tests/ports.rs::detection_and_setup_on_the_cooling_jacket",
  "crates/mesh-engine/tests/ports.rs::duct_input_refuses_maps_without_one_inlet_and_outlet",
  "crates/mesh-cli/tests/workflow.rs::generate_duct_reads_a_patch_map_like_a_port_file",
