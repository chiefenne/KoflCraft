name: M1 mesh acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup update stable && rustup default stable
      - name: Install Gmsh
        run: sudo apt-get update && sudo apt-get install -y gmsh
      - name: Verify VTU and Gmsh exports
        run: cargo m1 --require-gmsh
      - name: Save timing and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: m1-evidence
          path: target/m1-evidence/**/evidence.json
          if-no-files-found: error
