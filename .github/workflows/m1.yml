name: M1 mesh acceptance

# Fast run on every pull request and push to main: checks and the tests that
# are not ignored. Full run (also the ignored long mesh tests and the
# FoehnCraft acceptance job) when started by hand (Actions > M1 mesh
# acceptance > Run workflow, or `gh workflow run m1.yml --ref <branch>`) or
# when the pull request carries the label `full-ci`.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-${{ github.ref }}
  cancel-in-progress: true

env:
  FULL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@v2
      - name: Install Gmsh
        run: sudo apt-get update && sudo apt-get install -y gmsh
      - name: Format
        run: cargo fmt --all --check
      - name: Layering (SW-19)
        run: cargo xtask layering
      - name: Status page (AG-17)
        run: cargo xtask status --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (fast run skips the ignored long mesh tests)
        run: |
          if [ "$FULL" = "true" ]; then
            cargo test --release --locked --workspace --all-targets -- --include-ignored
          else
            cargo test --release --locked --workspace --all-targets
          fi

  acceptance:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup update stable && rustup default stable
      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@v2
      - name: Install Gmsh
        run: sudo apt-get update && sudo apt-get install -y gmsh
      - name: Find the FoehnCraft commit
        id: foehncraft
        run: echo "sha=$(git ls-remote https://github.com/chiefenne/Foehncraft.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore the FoehnCraft binary
        id: foehn-cache
        uses: actions/cache@v4
        with:
          path: ~/foehn-bin
          key: foehn-${{ runner.os }}-${{ steps.foehncraft.outputs.sha }}
      - name: Build FoehnCraft (FC-06 round trip)
        if: steps.foehn-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/chiefenne/Foehncraft.git "$RUNNER_TEMP/foehncraft"
          cargo build --release --locked -p foehncraft-cli --manifest-path "$RUNNER_TEMP/foehncraft/Cargo.toml"
          mkdir -p ~/foehn-bin
          cp "$RUNNER_TEMP/foehncraft/target/release/foehn" ~/foehn-bin/
      - name: Verify VTU, Gmsh and FoehnCraft exports
        run: FOEHN="$HOME/foehn-bin/foehn" cargo m1 --require-gmsh --require-foehn
      - name: Save timing and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: m1-evidence
          path: target/m1-evidence/**/evidence.json
          if-no-files-found: error
